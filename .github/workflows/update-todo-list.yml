name: Update TODO list

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Commit and push the updated README
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update-todo-list:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Fetch main
        run: git fetch origin main:refs/remotes/origin/main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update TODO list
        env:
          SHOULD_COMMIT: ${{ inputs.commit }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import difflib
          import re
          import subprocess

          readme_path = Path("README.md")
          original = readme_path.read_text()
          heading = "### 📝 Complete TODO List"

          # Parse the baseline README TODO list. Entries from unchanged files are
          # preserved exactly; only files changed on dev are reconstructed.
          entry_re = re.compile(r"^- \[ \] \*\*(.+?):(\d+)\*\* - (.*)$")
          entries = {}
          in_section = False
          for line in original.splitlines():
              if line == heading:
                  in_section = True
                  continue
              if in_section and line.startswith("## "):
                  break
              if in_section:
                  match = entry_re.match(line)
                  if match:
                      path, line_number, description = match.groups()
                      entries[(path, int(line_number))] = description

          merge_base = subprocess.run(
              ["git", "merge-base", "origin/main", "HEAD"],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.strip()
          diff_output = subprocess.run(
              ["git", "diff", "--name-status", "-z", f"{merge_base}..HEAD"],
              check=True,
              capture_output=True,
          ).stdout
          parts = diff_output.decode("utf-8").split("\0")

          changed_paths = set()
          deleted_paths = set()
          i = 0
          while i < len(parts):
              status = parts[i]
              if not status:
                  i += 1
                  continue
              code = status[0]
              if code in {"A", "M", "T"}:
                  path = parts[i + 1]
                  if path.endswith(".py"):
                      changed_paths.add(path)
                  i += 2
              elif code == "D":
                  path = parts[i + 1]
                  if path.endswith(".py"):
                      deleted_paths.add(path)
                  i += 2
              elif code in {"R", "C"}:
                  old_path = parts[i + 1]
                  new_path = parts[i + 2]
                  if old_path.endswith(".py"):
                      deleted_paths.add(old_path)
                  if new_path.endswith(".py"):
                      changed_paths.add(new_path)
                  i += 3
              else:
                  i += 2

          replacement_paths = changed_paths | deleted_paths
          for path in replacement_paths:
              for key in list(entries):
                  if key[0] == path:
                      del entries[key]

          # Extract TODO comments from the current version of changed .py files.
          todo_re = re.compile(r"#\s*TODO\b(?:\s*:)?\s*(.*?)\s*$")
          for path in sorted(changed_paths):
              text = Path(path).read_text()
              for line_number, line in enumerate(text.splitlines(), start=1):
                  if "TODO" not in line:
                      continue
                  match = todo_re.search(line)
                  if match:
                      description = match.group(1).strip()
                      entries[(path, line_number)] = description

          ordered_entries = sorted(entries.items(), key=lambda item: (item[0][0], item[0][1]))
          list_block = "\n".join(
              f"- [ ] **{path}:{line_number}** - {description}"
              for (path, line_number), description in ordered_entries
          )
          replacement_section = f"{heading}\n\n{list_block}\n\n"
          updated, replacements = re.subn(
              rf"(?ms)^{re.escape(heading)}\n.*?(?=^## )",
              replacement_section,
              original,
              count=1,
          )

          if replacements != 1:
              raise SystemExit(f"Expected to replace one TODO section, got {replacements}")
          if heading not in updated:
              raise SystemExit("Required TODO heading is missing")

          readme_path.write_text(updated)
          diff = "".join(
              difflib.unified_diff(
                  original.splitlines(keepends=True),
                  updated.splitlines(keepends=True),
                  fromfile="a/README.md",
                  tofile="b/README.md",
              )
          )
          print(f"Baseline entries: {len([k for k in entries if False])}")
          print(f"Updated TODO entries: {len(ordered_entries)}")
          print("Changed .py files:")
          for path in sorted(changed_paths):
              print(f"  {path}")
          for path in sorted(deleted_paths):
              print(f"  deleted {path}")
          print("TODO section diff:")
          print(diff)

      - name: Remove temporary workflow
        if: ${{ inputs.commit }}
        run: rm -f .github/workflows/update-todo-list.yml

      - name: Commit and push changes
        if: ${{ inputs.commit }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .github/workflows/update-todo-list.yml
          git commit -m "docs: update complete TODO list"
          git push origin dev
