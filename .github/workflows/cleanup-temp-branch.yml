name: Cleanup temporary branch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Delete temporary branch
        run: gh api -X DELETE "repos/RaikagePlaza/LUFFY/git/refs/heads/tmp%2Ftodo-update"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove this workflow
        run: |
          rm -f .github/workflows/cleanup-temp-branch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/cleanup-temp-branch.yml
          git commit -m "chore: remove temporary cleanup workflow"
          git push origin dev
